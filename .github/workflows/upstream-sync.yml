name: Upstream Sync & i18n Check

on:
  schedule:
    - cron: '0 3 * * *' # Daily at 03:00 UTC
  workflow_dispatch: # Manual trigger

permissions:
  contents: write
  pull-requests: write

jobs:
  check-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Check for Upstream Updates
        id: upstream
        run: |
          git remote add upstream https://github.com/chhoumann/quickadd.git || true
          git fetch upstream
          UPSTREAM_HEAD=$(git rev-parse upstream/master || git rev-parse upstream/main)
          MERGE_BASE=$(git merge-base HEAD $UPSTREAM_HEAD)
          
          if [ "$UPSTREAM_HEAD" = "$MERGE_BASE" ]; then
            echo "has_updates=false" >> $GITHUB_OUTPUT
            echo "No upstream updates found."
          else
            echo "has_updates=true" >> $GITHUB_OUTPUT
            echo "Upstream updates detected!"
          fi

      - name: Install Dependencies
        if: steps.upstream.outputs.has_updates == 'true'
        run: pnpm install

      - name: Validate i18n
        if: steps.upstream.outputs.has_updates == 'true'
        run: pnpm run check-i18n

      - name: Build
        if: steps.upstream.outputs.has_updates == 'true'
        run: pnpm run build
